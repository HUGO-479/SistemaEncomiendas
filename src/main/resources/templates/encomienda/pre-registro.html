<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pre-registro de Encomienda</title>
</head>
<body>
<h1>Pre-registro de Encomienda</h1>

<!-- El th:object debe coincidir con el model.addAttribute("preRegistro", ...) de tu controlador -->
<form th:action="@{/cliente/pre-registro/guardar}" th:object="${preRegistro}" method="post">

    <h3>Datos del Remitente</h3>
    <label>Tipo Documento:</label>
    <select th:field="*{remitenteTipoDocumento}">
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="PASAPORTE">Pasaporte</option>
    </select>
    <br>
    <label>N° Documento:</label>
    <input type="text" th:field="*{remitenteDni}" required>
    <br>
    <label>Nombres:</label>
    <input type="text" th:field="*{remitenteNombres}">
    <br>
    <label>Apellidos:</label>
    <input type="text" th:field="*{remitenteApellidos}">
    <br>
    <label>Razón Social (si es RUC):</label>
    <input type="text" th:field="*{remitenteRazonSocial}">
    <br>
    <label>Celular:</label>
    <input type="text" th:field="*{remitenteCelular}" required>
    <br>
    <label>Email:</label>
    <input type="email" th:field="*{remitenteEmail}">
    <br>
    <label>Dirección:</label>
    <input type="text" th:field="*{remitenteDireccion}">
    <br>

    <h3>Datos del Destinatario</h3>
    <label>Tipo Documento:</label>
    <select th:field="*{destinatarioTipoDocumento}">
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="PASAPORTE">Pasaporte</option>
    </select>
    <br>
    <label>N° Documento:</label>
    <input type="text" th:field="*{destinatarioDni}" required>
    <br>
    <label>Nombres:</label>
    <input type="text" th:field="*{destinatarioNombres}">
    <br>
    <label>Apellidos:</label>
    <input type="text" th:field="*{destinatarioApellidos}">
    <br>
    <label>Razón Social (si es RUC):</label>
    <input type="text" th:field="*{destinatarioRazonSocial}">
    <br>
    <label>Celular:</label>
    <input type="text" th:field="*{destinatarioCelular}" required>
    <br>
    <label>Email:</label>
    <input type="email" th:field="*{destinatarioEmail}">
    <br>
    <label>Dirección:</label>
    <input type="text" th:field="*{destinatarioDireccion}">
    <br>

    <h3>Datos del Envío</h3>
    <label>Descripción del paquete:</label>
    <input type="text" th:field="*{descripcionBulto}" required>
    <br>
    <label>Peso aproximado (kg):</label>
    <input type="number" step="0.1" th:field="*{pesoEstimado}" required>
    <br>

    <br>
    <button type="submit">Generar Pre-registro</button>
</form>

<!-- Mensajes de éxito/error -->
<div th:if="${mensajeExito}" style="color: green; font-weight: bold;">
    <span th:text="${mensajeExito}"></span>
</div>
<div th:if="${mensajeError}" style="color: red; font-weight: bold;">
    <span th:text="${mensajeError}"></span>
</div>
</body>
</html>
