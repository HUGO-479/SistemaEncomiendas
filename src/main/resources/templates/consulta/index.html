<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta de Envío</title>
    <style>
        /* ===== Variables ===== */
        :root {
            --color-bg:        #EEF6FF;
            --color-surface:   #FFFFFF;
            --color-primary:   #1E3A5F;
            --color-primary-2: #2A4D7A;
            --color-accent:    #FFA13A;
            --color-accent-dk: #B86A0F;
            --color-text:      #1E3A5F;
            --color-muted:     #6B86A8;
            --color-border:    #E3EDF8;

            --color-success-bg: #E6F6EC;
            --color-success:    #1E7A3E;
            --color-danger-bg:  #FDECEA;
            --color-danger:     #C0392B;

            --radius-sm:  8px;
            --radius-md:  12px;
            --radius-lg:  16px;
            --radius-pill: 999px;

            --shadow-sm: 0 2px 10px rgba(30,58,95,0.05);
            --shadow-md: 0 8px 24px rgba(30,58,95,0.08);

            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
        }

        /* ===== Reset y base ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding: var(--space-4) var(--space-2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenedor central tipo "card" */
        body > * {
            width: 100%;
            max-width: 560px;
        }

        /* ===== Encabezado ===== */
        h1 {
            font-size: clamp(24px, 4.5vw, 32px);
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--space-1);
            line-height: 1.25;
        }

        body > p {
            color: var(--color-muted);
            font-size: 15px;
            margin-bottom: var(--space-3);
        }

        /* ===== Formulario buscador ===== */
        form {
            display: flex;
            gap: var(--space-1);
            background: var(--color-surface);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--space-3);
        }

        form input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 15px;
            font-family: inherit;
            color: var(--color-text);
            background: #F8FBFF;
            border: 1.5px solid transparent;
            border-radius: var(--radius-md);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        form input[type="text"]::placeholder {
            color: var(--color-muted);
        }

        form input[type="text"]:hover {
            background: #F1F7FE;
        }

        form input[type="text"]:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255,161,58,0.25);
        }

        form button {
            background: var(--color-accent);
            color: var(--color-primary);
            font-family: inherit;
            font-weight: 800;
            font-size: 15px;
            padding: 14px 26px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255,161,58,0.35);
        }

        form button:active {
            transform: translateY(0);
        }

        form button:focus-visible {
            outline: 3px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* ===== Mensaje de error ===== */
        body > div[th\:if] {
            /* fallback */
        }

        /* Cualquier div hijo directo que no sea el resultado (error) */
        body > div:not(:has(h2)) {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            font-weight: 700;
            font-size: 14px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--color-danger);
            margin-bottom: var(--space-2);
        }

        /* ===== Tarjeta de resultado ===== */
        body > div:has(h2) {
            background: var(--color-surface);
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border-top: 5px solid var(--color-accent);
            margin-top: var(--space-2);
            animation: fadeInUp 0.35s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        body > div h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--space-2);
            padding-bottom: var(--space-1);
            border-bottom: 1px solid var(--color-border);
        }

        body > div h2::before {
            content: "📦 ";
            margin-right: 4px;
        }

        body > div p {
            font-size: 15px;
            color: var(--color-text);
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: baseline;
        }

        body > div p strong {
            color: var(--color-muted);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            min-width: 150px;
        }

        /* Estado: badge verde */
        body > div p span[th\:text] {
            /* fallback */
        }

        body > div p:nth-of-type(2) span {
            display: inline-block;
            background: var(--color-success-bg);
            color: var(--color-success);
            font-weight: 800;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.02em;
        }

        /* Nota de seguridad */
        body > div p:last-child {
            font-size: 13px;
            color: var(--color-muted);
            font-style: italic;
            margin-top: var(--space-2);
            padding-top: var(--space-2);
            border-top: 1px dashed var(--color-border);
            display: block;
        }

        /* ===== Responsive ===== */
        @media (max-width: 520px) {
            body { padding: var(--space-3) var(--space-2); }

            form {
                flex-direction: column;
                padding: var(--space-1);
            }

            form button { width: 100%; }

            body > div:has(h2) { padding: var(--space-3); }

            body > div p strong {
                min-width: 100%;
                margin-bottom: 2px;
            }
        }

        /* ===== Accesibilidad ===== */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
<h1>Consulta el estado de tu paquete</h1>
<p>Ingresa el código de guía que te entregamos al registrar tu envío.</p>

<!-- Formulario que envía el código por POST -->
<form th:action="@{/consulta}" method="post">
    <input type="text" name="codigo" placeholder="Ej: ENC-90DDCC" required>
    <button type="submit">Buscar</button>
</form>

<!-- Mensaje de error si el código no existe -->
<div th:if="${error}" style="color: red; font-weight: bold; margin-top: 20px;">
    <span th:text="${error}"></span>
</div>

<!-- Resultado de la consulta (solo si el código existe) -->
<div th:if="${codigo != null}">
    <h2>Información del Envío</h2>

    <p><strong>Código de Guía:</strong> <span th:text="${codigo}"></span></p>

    <p><strong>Estado Actual:</strong>
        <span th:text="${estado}"></span>
    </p>

    <p><strong>Agencia de Destino:</strong> <span th:text="${destino}"></span></p>

    <p><strong>Fecha de Registro:</strong> <span th:text="${fecha}"></span></p>

    <p>* Por seguridad, no mostramos datos personales como DNI o teléfono.</p>
</div>
</body>
</html>
