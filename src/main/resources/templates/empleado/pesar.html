<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesar Paquete - Atyra Express</title>
</head>
<body style="font-family:'Inter', Arial, sans-serif; padding:20px; background-color:#EEF6FF; margin:0;">

<div style="max-width:850px; margin:0 auto; background:white; padding:30px; border-radius:16px; box-shadow:0 8px 24px rgba(30,58,95,0.08); border:1px solid #E3EDF8;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
        <div style="background:#FFA13A; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;">📦</div>
        <span style="font-weight:800; color:#1E3A5F; font-size:18px;">Atyra <span style="color:#B86A0F;">Express</span></span>
        <a href="/recepcion/buscar" style="margin-left:auto; text-decoration:none; color:#6B86A8; font-size:12px; border:1px solid #E3EDF8; padding:6px 14px; border-radius:999px;">← Volver a Buscar</a>
    </div>

    <h1 style="color:#1E3A5F; margin:0 0 6px 0; font-size:26px; font-weight:800;">Recepción: Pesar Paquete</h1>
    <p style="color:#6B86A8; margin:0 0 24px 0; font-size:14px;">Ingresa el peso real y las dimensiones del paquete para calcular el peso volumétrico.</p>

    <form th:action="@{/recepcion/pesar/{id}(id=${envioId})}" method="post" style="display:flex; gap:20px; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
            <div style="margin-bottom:16px;">
                <label style="font-size:13px; font-weight:700; color:#1E3A5F; display:block; margin-bottom:6px;">Peso Real (kg)</label>
                <input type="number" step="0.1" name="peso" placeholder="0.00" required style="width:100%; padding:12px 14px; border:1px solid #D6E4F5; border-radius:12px; font-size:14px; box-sizing:border-box; outline:none; background:#F6F9FF;">
            </div>
            <div style="display:flex; gap:12px;">
                <div style="flex:1;">
                    <label style="font-size:13px; font-weight:700; color:#1E3A5F; display:block; margin-bottom:6px;">Largo (cm)</label>
                    <input type="number" step="0.1" name="largo" value="1" required style="width:100%; padding:12px 14px; border:1px solid #D6E4F5; border-radius:12px; font-size:14px; box-sizing:border-box; outline:none; background:#F6F9FF;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:13px; font-weight:700; color:#1E3A5F; display:block; margin-bottom:6px;">Ancho (cm)</label>
                    <input type="number" step="0.1" name="ancho" value="1" required style="width:100%; padding:12px 14px; border:1px solid #D6E4F5; border-radius:12px; font-size:14px; box-sizing:border-box; outline:none; background:#F6F9FF;">
                </div>
            </div>
            <div style="margin-top:16px;">
                <label style="font-size:13px; font-weight:700; color:#1E3A5F; display:block; margin-bottom:6px;">Alto (cm)</label>
                <input type="number" step="0.1" name="alto" value="1" required style="width:100%; padding:12px 14px; border:1px solid #D6E4F5; border-radius:12px; font-size:14px; box-sizing:border-box; outline:none; background:#F6F9FF;">
            </div>
        </div>

        <div style="flex:1; min-width:260px; background:#F6F9FF; border:1px solid #D6E4F5; border-radius:16px; padding:20px;">
            <h3 style="color:#1E3A5F; margin:0 0 10px 0; font-size:16px;">Peso Volumétrico ℹ️</h3>
            <p style="font-size:12px; color:#6B86A8; margin:0 0 4px 0;">Fórmula:</p>
            <p style="font-size:13px; color:#1E3A5F; font-weight:700; margin:0 0 14px 0;">Volumen = (Largo × Ancho × Alto) / 5000</p>
            <p style="font-size:12px; color:#6B86A8; margin:0;">Se usará el mayor valor entre Peso Real y Peso Volumétrico para el cobro.</p>
            <button type="submit" style="width:100%; margin-top:18px; padding:14px; background:#1E3A5F; color:white; border:none; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer;">✓ Confirmar Recepción</button>
        </div>
    </form>

    <div style="text-align:right; margin-top:24px; padding-top:16px; border-top:1px solid #EAF0F8;">
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit" style="padding:8px 20px; background:transparent; color:#6B86A8; border:1px solid #E3EDF8; border-radius:999px; cursor:pointer; font-size:13px;">Cerrar Sesión</button>
        </form>
    </div>
</div>

</body>
</html>
