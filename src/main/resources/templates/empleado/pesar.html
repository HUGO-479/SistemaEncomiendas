<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Pesar Paquete</title></head>
<body>
<h1>Recepción: Pesar Paquete</h1>
<form th:action="@{/recepcion/pesar/{id}(id=${envioId})}" method="post">
    <label>Peso Real (kg):</label>
    <input type="number" step="0.1" name="peso" required><br><br>

    <label>Largo (cm):</label>
    <input type="number" step="0.1" name="largo" value="1" required><br><br>

    <label>Ancho (cm):</label>
    <input type="number" step="0.1" name="ancho" value="1" required><br><br>

    <label>Alto (cm):</label>
    <input type="number" step="0.1" name="alto" value="1" required><br><br>

    <button type="submit">Confirmar Recepción</button>
</form>
</body>
</html>
