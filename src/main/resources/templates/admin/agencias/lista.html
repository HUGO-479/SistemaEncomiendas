<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Agencias - Atyra Express</title>

    <!-- Enlace a tu CSS global -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="agencias-container">

    <!-- Logo -->
    <div class="agencias-header">
        <div class="agencias-logo">
            <div class="agencias-logo-icon">📦</div>
            <span>Atyra <span style="color: #B86A0F;">Express</span></span>
        </div>
        <h1>Gestión de Agencias</h1>
    </div>

    <!-- Navegación -->
    <div class="agencias-nav">
        <a th:href="@{/admin/dashboard}">← Panel principal</a>
        <a th:href="@{/admin/agencias/nueva}">+ Nueva agencia</a>
    </div>

    <!-- Mensajes -->
    <p th:if="${exito}" class="agencias-alert alert-success" th:text="${exito}"></p>
    <p th:if="${error}" class="agencias-alert alert-error" th:text="${error}"></p>

    <!-- Tabla -->
    <div class="agencias-table-responsive">
        <table class="agencias-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Ciudad</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(agencias)}">
                <td colspan="8" class="agencias-empty">No hay agencias registradas.</td>
            </tr>

            <tr th:each="agencia : ${agencias}">
                <td th:text="${agencia.id}"></td>
                <td th:text="${agencia.nombre}" style="font-weight:700; color:var(--primary);"></td>
                <td th:text="${agencia.departamento}"></td>
                <td th:text="${agencia.ciudad}"></td>
                <td th:text="${agencia.direccion}"></td>
                <td th:text="${agencia.telefono}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${agencia.activa} ? 'badge-active' : 'badge-inactive'"
                          th:text="${agencia.activa} ? 'Activa' : 'Inactiva'"></span>
                </td>
                <td>
                    <div class="agencias-actions">
                        <a th:href="@{/admin/agencias/{id}/editar(id=${agencia.id})}" class="btn-edit">Editar</a>

                        <form th:action="@{/admin/agencias/{id}/estado(id=${agencia.id})}" method="post" style="display:inline;">
                            <button type="submit"
                                    class="btn-status"
                                    th:classappend="${agencia.activa} ? 'btn-danger' : 'btn-success'"
                                    th:text="${agencia.activa} ? 'Desactivar' : 'Activar'"
                                    onclick="return confirm('¿Confirmar cambio de estado?')">
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
