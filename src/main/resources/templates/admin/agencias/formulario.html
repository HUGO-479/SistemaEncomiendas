<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Agencia</title>
    <style>
        /* ===== Variables ===== */
        :root {
            --color-bg:        #EEF6FF;
            --color-surface:   #FFFFFF;
            --color-primary:   #1E3A5F;
            --color-primary-2: #2A4D7A;
            --color-accent:    #FFA13A;
            --color-accent-dk: #B86A0F;
            --color-text:      #1E3A5F;
            --color-muted:     #6B86A8;
            --color-border:    #E3EDF8;
            --color-danger:    #C0392B;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 999px;

            --shadow-sm: 0 2px 10px rgba(30,58,95,0.05);
            --shadow-md: 0 8px 24px rgba(30,58,95,0.08);

            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
        }

        /* ===== Reset y base ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding: var(--space-4) var(--space-2);
            min-height: 100vh;
        }

        /* ===== Contenedor del formulario ===== */
        body > * {
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--space-1);
        }

        /* Enlace "Volver al listado" */
        body > a {
            display: inline-block;
            color: var(--color-muted);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: var(--space-2);
            transition: color 0.2s;
        }
        body > a:hover,
        body > a:focus-visible {
            color: var(--color-primary);
            text-decoration: underline;
        }

        /* ===== Separadores ===== */
        hr {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: var(--space-3) 0;
        }

        /* ===== Formulario ===== */
        form {
            background: var(--color-surface);
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        /* Cada grupo label + input */
        form > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            color: var(--color-primary);
        }

        input[type="text"],
        input[type="tel"],
        input[type="hidden"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--color-text);
            background: #F8FBFF;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="text"]:hover,
        input[type="tel"]:hover {
            border-color: #C7DBF0;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255,161,58,0.25);
        }

        input:required:invalid:not(:placeholder-shown) {
            border-color: var(--color-danger);
        }

        /* ===== Botones ===== */
        button[type="submit"] {
            background: var(--color-accent);
            color: var(--color-primary);
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: var(--shadow-sm);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255,161,58,0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:focus-visible {
            outline: 3px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* Enlace Cancelar (hermano del botón) */
        form > a {
            text-align: center;
            color: var(--color-muted);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            padding: 10px;
            border-radius: var(--radius-pill);
            transition: color 0.2s, background 0.2s;
        }
        form > a:hover,
        form > a:focus-visible {
            color: var(--color-primary);
            background: rgba(30,58,95,0.06);
            outline: none;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            body { padding: var(--space-3) var(--space-2); }
            form { padding: var(--space-3); }
            button[type="submit"] { width: 100%; }
        }

        /* ===== Accesibilidad: reduce motion ===== */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<h1 th:text="${agencia.id == null}
    ? 'Registrar nueva agencia'
    : 'Editar agencia'">
</h1>

<a th:href="@{/admin/agencias}">Volver al listado</a>

<hr>

<form th:action="@{/admin/agencias/guardar}"
      th:object="${agencia}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="nombre">Nombre:</label>
        <input id="nombre"
               type="text"
               th:field="*{nombre}"
               maxlength="100"
               placeholder="Ej. Agencia Lima Centro"
               required>
    </div>

    <div>
        <label for="departamento">Departamento:</label>
        <input id="departamento"
               type="text"
               th:field="*{departamento}"
               maxlength="60"
               placeholder="Ej. Lima"
               required>
    </div>

    <div>
        <label for="ciudad">Ciudad:</label>
        <input id="ciudad"
               type="text"
               th:field="*{ciudad}"
               maxlength="60"
               placeholder="Ej. Lima"
               required>
    </div>

    <div>
        <label for="direccion">Dirección:</label>
        <input id="direccion"
               type="text"
               th:field="*{direccion}"
               placeholder="Av. Ejemplo 123, referencia">
    </div>

    <div>
        <label for="telefono">Teléfono:</label>
        <input id="telefono"
               type="tel"
               th:field="*{telefono}"
               placeholder="+51 999 999 999">
    </div>

    <hr>

    <button type="submit"
            th:text="${agencia.id == null}
            ? 'Registrar agencia'
            : 'Guardar cambios'">
    </button>

    <a th:href="@{/admin/agencias}">Cancelar</a>

</form>

</body>
</html>
