<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Agencia</title>

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<h1 th:text="${agencia.id == null}
    ? 'Registrar nueva agencia'
    : 'Editar agencia'">
</h1>

<a th:href="@{/admin/agencias}">Volver al listado</a>

<hr>

<form th:action="@{/admin/agencias/guardar}"
      th:object="${agencia}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="nombre">Nombre:</label>
        <input id="nombre"
               type="text"
               th:field="*{nombre}"
               maxlength="100"
               placeholder="Ej. Agencia Lima Centro"
               required>
    </div>

    <div>
        <label for="departamento">Departamento:</label>
        <input id="departamento"
               type="text"
               th:field="*{departamento}"
               maxlength="60"
               placeholder="Ej. Lima"
               required>
    </div>

    <div>
        <label for="ciudad">Ciudad:</label>
        <input id="ciudad"
               type="text"
               th:field="*{ciudad}"
               maxlength="60"
               placeholder="Ej. Lima"
               required>
    </div>

    <div>
        <label for="direccion">Dirección:</label>
        <input id="direccion"
               type="text"
               th:field="*{direccion}"
               placeholder="Av. Ejemplo 123, referencia">
    </div>

    <div>
        <label for="telefono">Teléfono:</label>
        <input id="telefono"
               type="tel"
               th:field="*{telefono}"
               placeholder="+51 999 999 999">
    </div>

    <hr>

    <button type="submit"
            th:text="${agencia.id == null}
            ? 'Registrar agencia'
            : 'Guardar cambios'">
    </button>

    <a th:href="@{/admin/agencias}">Cancelar</a>

</form>

</body>
</html>
