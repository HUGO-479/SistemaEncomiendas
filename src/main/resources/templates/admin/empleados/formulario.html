<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Empleado - Atyra Express</title>

    <!-- Enlace a tu CSS de Administración -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="lista-body">

<div class="admin-container" style="max-width: 640px; margin-top: 20px;">

    <h1 style="text-align: center; margin-bottom: 20px;">Registrar Nuevo Empleado</h1>

    <a th:href="@{/admin/dashboard}" style="display: block; text-align: center; margin-bottom: 20px; color: var(--muted); text-decoration: none; font-weight: 700;">← Volver al panel</a>

    <hr style="margin-bottom: 20px; border-color: var(--border);">

    <!-- Mensaje de Error -->
    <p th:if="${param.error}" class="form-error-alert">El usuario ya existe.</p>

    <form th:action="@{/admin/empleados/guardar}" method="post" style="box-shadow: none; padding: 0;">

        <div>
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" maxlength="8" placeholder="Ej. 12345678" required>
        </div>

        <div>
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" name="nombres" placeholder="Nombres completos" required>
        </div>

        <div>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos completos" required>
        </div>

        <div>
            <label for="celular">Celular:</label>
            <input type="text" id="celular" name="celular" placeholder="+51 999 999 999" required>
        </div>

        <div>
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" placeholder="Nombre de usuario para login" required>
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div>
            <label for="agenciaId">Agencia:</label>
            <select id="agenciaId" name="agenciaId" required>
                <option value="">-- Seleccione una agencia --</option>
                <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
            </select>
        </div>

        <button type="submit" style="margin-top: 10px;">Guardar Empleado</button>

        <a th:href="@{/admin/empleados}">Cancelar</a>

    </form>
</div>

</body>
</html>
