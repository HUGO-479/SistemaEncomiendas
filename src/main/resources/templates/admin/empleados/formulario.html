<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Empleado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #EEF6FF; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
        .btn { padding: 10px 20px; background-color: #FFA13A; color: white; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>Registrar Nuevo Empleado</h1>
    <div th:if="${param.error}" style="color: red;">El usuario ya existe.</div>

    <form th:action="@{/admin/empleados/guardar}" method="post">
        <div class="form-group"><label>DNI</label><input type="text" name="dni" required></div>
        <div class="form-group"><label>Nombres</label><input type="text" name="nombres" required></div>
        <div class="form-group"><label>Apellidos</label><input type="text" name="apellidos" required></div>
        <div class="form-group"><label>Celular</label><input type="text" name="celular" required></div>
        <div class="form-group"><label>Usuario</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Contraseña</label><input type="password" name="password" required></div>
        <div class="form-group">
            <label>Agencia</label>
            <select name="agenciaId" required>
                <option value="">Seleccione...</option>
                <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn">Guardar Empleado</button>
    </form>
</div>
</body>
</html>
