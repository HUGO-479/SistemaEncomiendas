<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de tipo de paquete</title>
</head>
<body>

<h1 th:text="${tipo.id == null}
    ? 'Registrar tipo de paquete'
    : 'Editar tipo de paquete'">
</h1>

<a th:href="@{/admin/tipos-paquete}">
    Volver al listado
</a>

<hr>

<p th:if="${error}" th:text="${error}"></p>

<form th:action="@{/admin/tipos-paquete/guardar}"
      th:object="${tipo}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="nombre">Nombre:</label>

        <input id="nombre"
               type="text"
               th:field="*{nombre}"
               maxlength="50"
               required>
    </div>

    <div>
        <label for="descripcion">Descripción:</label>

        <textarea id="descripcion"
                  th:field="*{descripcion}"
                  rows="4"></textarea>
    </div>

    <hr>

    <button type="submit"
            th:text="${tipo.id == null}
            ? 'Registrar tipo'
            : 'Guardar cambios'">
    </button>

    <a th:href="@{/admin/tipos-paquete}">
        Cancelar
    </a>

</form>

</body>
</html>
