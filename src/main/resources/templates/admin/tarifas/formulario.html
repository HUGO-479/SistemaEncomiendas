<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de tarifas</title>
    <style>
        /* ===== Variables ===== */
        :root {
            --color-bg:        #EEF6FF;
            --color-surface:   #FFFFFF;
            --color-primary:   #1E3A5F;
            --color-primary-2: #2A4D7A;
            --color-accent:    #FFA13A;
            --color-accent-dk: #B86A0F;
            --color-text:      #1E3A5F;
            --color-muted:     #6B86A8;
            --color-border:    #E3EDF8;

            --color-success-bg: #E6F6EC;
            --color-success:    #1E7A3E;
            --color-danger-bg:  #FDECEA;
            --color-danger:     #C0392B;

            --radius-sm:  8px;
            --radius-md:  12px;
            --radius-lg:  16px;
            --radius-pill: 999px;

            --shadow-sm: 0 2px 10px rgba(30,58,95,0.05);
            --shadow-md: 0 8px 24px rgba(30,58,95,0.08);

            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
        }

        /* ===== Reset y base ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding: var(--space-4) var(--space-2);
            min-height: 100vh;
        }

        /* Contenedor central */
        body > * {
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--space-1);
        }

        /* Enlace "Volver" */
        body > a {
            display: inline-block;
            color: var(--color-muted);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: var(--space-2);
            transition: color 0.2s;
        }
        body > a:hover,
        body > a:focus-visible {
            color: var(--color-primary);
            text-decoration: underline;
        }

        /* ===== Mensaje de error ===== */
        p[th\:if] {
            /* fallback vacío; usamos clase por si se quiere */
        }

        body > p {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: var(--space-2);
        }

        /* Mensaje de error flash: fondo rojo suave */
        body > p:not(:empty) {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border-left: 4px solid var(--color-danger);
        }

        /* ===== Formulario ===== */
        form {
            background: var(--color-surface);
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        /* Grupo label + control */
        form > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            color: var(--color-primary);
        }

        /* ===== Inputs de texto / número ===== */
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--color-text);
            background: #F8FBFF;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="number"]:hover,
        input[type="text"]:hover {
            border-color: #C7DBF0;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255,161,58,0.25);
        }

        /* ===== Selects ===== */
        select {
            width: 100%;
            padding: 12px 40px 12px 14px; /* espacio para la flecha */
            font-size: 15px;
            font-family: inherit;
            color: var(--color-text);
            background-color: #F8FBFF;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231E3A5F' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        select:hover {
            border-color: #C7DBF0;
        }

        select:focus {
            outline: none;
            border-color: var(--color-accent);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255,161,58,0.25);
        }

        /* Opción placeholder */
        select option[value=""] {
            color: var(--color-muted);
        }

        /* ===== Botón submit ===== */
        button[type="submit"] {
            background: var(--color-accent);
            color: var(--color-primary);
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: var(--shadow-sm);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255,161,58,0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:focus-visible {
            outline: 3px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* Enlace Cancelar */
        form > a {
            text-align: center;
            color: var(--color-muted);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            padding: 10px;
            border-radius: var(--radius-pill);
            transition: color 0.2s, background 0.2s;
        }
        form > a:hover,
        form > a:focus-visible {
            color: var(--color-primary);
            background: rgba(30,58,95,0.06);
            outline: none;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            body { padding: var(--space-3) var(--space-2); }
            form { padding: var(--space-3); }
            button[type="submit"] { width: 100%; }
        }

        /* ===== Accesibilidad ===== */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<h1 th:text="${tarifa.id == null}
    ? 'Registrar tarifa'
    : 'Editar tarifa'"></h1>

<a th:href="@{/admin/tarifas}">Volver</a>

<p th:if="${error}" th:text="${error}"></p>

<form th:action="@{/admin/tarifas/guardar}" method="post">

    <input type="hidden" name="id"
           th:if="${tarifa.id != null}"
           th:value="${tarifa.id}">

    <div>
        <label for="origenId">Agencia de origen:</label>
        <select id="origenId" name="origenId" required>
            <option value="">Seleccione origen</option>
            <option th:each="ag : ${agencias}"
                    th:value="${ag.id}"
                    th:text="${ag.nombre}"
                    th:selected="${tarifa.agenciaOrigen != null
                        and tarifa.agenciaOrigen.id == ag.id}">
            </option>
        </select>
    </div>

    <div>
        <label for="destinoId">Agencia de destino:</label>
        <select id="destinoId" name="destinoId" required>
            <option value="">Seleccione destino</option>
            <option th:each="ag : ${agencias}"
                    th:value="${ag.id}"
                    th:text="${ag.nombre}"
                    th:selected="${tarifa.agenciaDestino != null
                        and tarifa.agenciaDestino.id == ag.id}">
            </option>
        </select>
    </div>

    <div>
        <label for="precioBase">Precio base (S/):</label>
        <input type="number" id="precioBase"
               name="precioBase"
               th:value="${tarifa.precioBase}"
               min="0" step="0.01" required>
    </div>

    <div>
        <label for="precioPorKg">Precio por kg (S/):</label>
        <input type="number" id="precioPorKg"
               name="precioPorKg"
               th:value="${tarifa.precioPorKg}"
               min="0" step="0.01" required>
    </div>

    <button type="submit"
            th:text="${tarifa.id == null}
                ? 'Registrar tarifa'
                : 'Guardar cambios'">
    </button>

    <a th:href="@{/admin/tarifas}">Cancelar</a>

</form>

</body>
</html>
