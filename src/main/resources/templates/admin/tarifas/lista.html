<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Tarifas - Atyra Express</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #EEF6FF;
            margin: 0;
            padding: 20px;
            color: #1E3A5F;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(30,58,95,0.08);
            border: 1px solid #E3EDF8;
        }
        .logo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .logo-icon {
            background: #FFA13A;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .logo-text {
            font-weight: 800;
            color: #1E3A5F;
            font-size: 18px;
        }
        .logo-text span { color: #B86A0F; }

        h1 { font-size: 24px; font-weight: 800; margin: 0 0 20px 0; }

        .nav-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 24px;
        }
        .nav-bar a {
            text-decoration: none;
            color: #6B86A8;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #F6F9FF;
            border: 1px solid #D6E4F5;
            transition: all 0.2s;
        }
        .nav-bar a:hover {
            background: #FFA13A;
            color: #1E3A5F;
            border-color: #FFA13A;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background-color: #F6F9FF;
            color: #1E3A5F;
            font-weight: 800;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #E3EDF8;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #EAF0F8;
            color: #4A6583;
            vertical-align: middle;
        }
        tr:hover td { background-color: #F9FBFF; }

        .badge-activa {
            background: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-inactiva {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-edit {
            display: inline-block;
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 5px;
        }
        .btn-edit:hover { opacity: 0.9; }

        .btn-status {
            padding: 6px 12px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-status:hover { opacity: 0.9; }

        .empty-message {
            text-align: center;
            color: #6B86A8;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Logo -->
    <div class="logo-header">
        <div class="logo-icon">📦</div>
        <span class="logo-text">Atyra <span>Express</span></span>
    </div>

    <h1>Gestión de Tarifas</h1>

    <!-- Navegación -->
    <nav class="nav-bar">
        <a th:href="@{/admin/dashboard}">← Panel administrador</a>
        <a th:href="@{/admin/tarifas/nueva}">+ Nueva tarifa</a>
    </nav>

    <!-- Mensajes -->
    <p th:if="${exito}" class="alert alert-success" th:text="${exito}"></p>
    <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

    <!-- Tabla de Tarifas -->
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Precio base (S/)</th>
                <th>Precio por kg (S/)</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(tarifas)}">
                <td colspan="7" class="empty-message">No existen tarifas registradas.</td>
            </tr>

            <tr th:each="tarifa : ${tarifas}">
                <td th:text="${tarifa.id}"></td>
                <td th:text="${tarifa.agenciaOrigen.nombre}" style="font-weight:700; color:#1E3A5F;"></td>
                <td th:text="${tarifa.agenciaDestino.nombre}" style="font-weight:700; color:#1E3A5F;"></td>
                <td th:text="'S/ ' + ${tarifa.precioBase}"></td>
                <td th:text="'S/ ' + ${tarifa.precioPorKg}"></td>
                <td>
                    <span th:if="${tarifa.activa}" class="badge-activa">Activa</span>
                    <span th:if="${!tarifa.activa}" class="badge-inactiva">Inactiva</span>
                </td>

                <td>
                    <a th:href="@{/admin/tarifas/{id}/editar(id=${tarifa.id})}" class="btn-edit">
                        Editar
                    </a>

                    <form th:action="@{/admin/tarifas/{id}/estado(id=${tarifa.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn-status"
                                th:text="${tarifa.activa} ? 'Desactivar' : 'Activar'">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
