<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Tarifas - Atyra Express</title>

    <!-- Enlace al CSS Global -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="lista-body">

<div class="agencias-container">

    <!-- Logo -->
    <div class="agencias-header">
        <div class="agencias-logo">
            <div class="agencias-logo-icon">📦</div>
            <span>Atyra <span style="color: var(--accent-dk);">Express</span></span>
        </div>
        <h1>Gestión de Tarifas</h1>
    </div>

    <!-- Navegación -->
    <nav class="agencias-nav">
        <a th:href="@{/admin/dashboard}">← Panel administrador</a>
        <a th:href="@{/admin/tarifas/nueva}">+ Nueva tarifa</a>
    </nav>

    <!-- Mensajes -->
    <p th:if="${exito}" class="agencias-alert alert-success" th:text="${exito}"></p>
    <p th:if="${error}" class="agencias-alert alert-error" th:text="${error}"></p>

    <!-- Tabla de Tarifas -->
    <div class="agencias-table-responsive">
        <table class="agencias-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Precio base (S/)</th>
                <th>Precio por kg (S/)</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(tarifas)}">
                <td colspan="7" class="agencias-empty">No existen tarifas registradas.</td>
            </tr>

            <tr th:each="tarifa : ${tarifas}">
                <td th:text="${tarifa.id}"></td>
                <td th:text="${tarifa.agenciaOrigen.nombre}" style="font-weight:700; color:var(--primary);"></td>
                <td th:text="${tarifa.agenciaDestino.nombre}" style="font-weight:700; color:var(--primary);"></td>
                <td th:text="'S/ ' + ${tarifa.precioBase}"></td>
                <td th:text="'S/ ' + ${tarifa.precioPorKg}"></td>
                <td>
                    <span th:if="${tarifa.activa}" class="badge badge-active">Activa</span>
                    <span th:if="${!tarifa.activa}" class="badge badge-inactive">Inactiva</span>
                </td>

                <td>
                    <div class="agencias-actions">
                        <a th:href="@{/admin/tarifas/{id}/editar(id=${tarifa.id})}" class="btn-edit">
                            Editar
                        </a>

                        <form th:action="@{/admin/tarifas/{id}/estado(id=${tarifa.id})}" method="post" style="display:inline">
                            <button type="submit"
                                    class="btn-status"
                                    th:classappend="${tarifa.activa} ? 'btn-danger' : 'btn-success'"
                                    th:text="${tarifa.activa} ? 'Desactivar' : 'Activar'">
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
