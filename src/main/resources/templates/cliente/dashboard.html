<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Cliente - Atyra Express</title>

    <!-- Enlace al CSS específico de Clientes -->
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body class="cliente-body">

<div class="cliente-container">

    <!-- Logo -->
    <div class="cliente-header">
        <div class="cliente-logo">
            <div class="cliente-logo-icon">📦</div>
            <span>Atyra <span style="color: var(--accent-dk);">Express</span></span>
        </div>
    </div>

    <h1>Panel del Cliente</h1>
    <p class="cliente-subtitle">¿Qué deseas hacer hoy?</p>

    <!-- Mensaje de Éxito -->
    <div th:if="${mensajeExito}" class="cliente-alert alert-success" th:text="${mensajeExito}"></div>

    <!-- Grid de Opciones -->
    <div class="cliente-menu-grid">
        <a th:href="@{/cliente/pre-registro}" class="cliente-menu-card">
            <div class="cliente-menu-icon">✉️</div>
            <h3>Nuevo Envío</h3>
            <p>Registra un nuevo paquete para enviar.</p>
        </a>
        <a th:href="@{/mis-envios}" class="cliente-menu-card">
            <div class="cliente-menu-icon">📋</div>
            <h3>Mis Envíos</h3>
            <p>Revisa el estado de tus paquetes enviados.</p>
        </a>
    </div>

    <!-- Footer y Logout -->
    <div class="cliente-footer-actions">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-logout-cliente">Cerrar Sesión</button>
        </form>
    </div>

</div>

</body>
</html>
