<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pre-registro de Encomienda</title>
</head>
<body>
<h1>Pre-registro de Encomienda</h1>

<form th:action="@{/cliente/pre-registro/guardar}" th:object="${preRegistro}" method="post">

    <!-- ================= REMITENTE ================= -->
    <h3>Datos del Remitente</h3>
    <label>Tipo Documento:</label>
    <select th:field="*{remitenteTipoDocumento}" id="remitenteTipoDocumento">
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="PASAPORTE">Pasaporte</option>
    </select><br>

    <label>N° Documento:</label>
    <input type="text" th:field="*{remitenteDni}" id="remitenteDni" required maxlength="8"><br>

    <label>Nombres:</label>
    <input type="text" th:field="*{remitenteNombres}"><br>

    <label>Apellidos:</label>
    <input type="text" th:field="*{remitenteApellidos}"><br>

    <label>Razón Social (si es RUC):</label>
    <input type="text" th:field="*{remitenteRazonSocial}"><br>

    <label>Celular:</label>
    <input type="text" th:field="*{remitenteCelular}" required><br>

    <!-- ================= DESTINATARIO ================= -->
    <h3>Datos del Destinatario</h3>
    <label>Tipo Documento:</label>
    <select th:field="*{destinatarioTipoDocumento}" id="destinatarioTipoDocumento">
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="PASAPORTE">Pasaporte</option>
    </select><br>

    <label>N° Documento:</label>
    <input type="text" th:field="*{destinatarioDni}" id="destinatarioDni" required maxlength="8"><br>

    <label>Nombres:</label>
    <input type="text" th:field="*{destinatarioNombres}"><br>

    <label>Apellidos:</label>
    <input type="text" th:field="*{destinatarioApellidos}"><br>

    <label>Razón Social (si es RUC):</label>
    <input type="text" th:field="*{destinatarioRazonSocial}"><br>

    <label>Celular:</label>
    <input type="text" th:field="*{destinatarioCelular}" required><br>

    <!-- ================= DATOS DEL ENVÍO ================= -->
    <h3>Datos del Envío</h3>

    <label>Agencia Origen:</label>
    <select th:field="*{agenciaOrigenId}" required>
        <option value="">-- Seleccione --</option>
        <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
    </select><br>

    <label>Agencia Destino:</label>
    <select th:field="*{agenciaDestinoId}" required>
        <option value="">-- Seleccione --</option>
        <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
    </select><br>

    <label>Tipo de Paquete:</label>
    <select th:field="*{tipoPaqueteId}" required>
        <option value="">-- Seleccione --</option>
        <option th:each="tp : ${tiposPaquete}" th:value="${tp.id}" th:text="${tp.nombre}"></option>
    </select><br>

    <label>Descripción del paquete:</label>
    <input type="text" th:field="*{descripcionBulto}" required><br>

    <label>Peso aproximado (kg):</label>
    <input type="number" step="0.1" th:field="*{pesoEstimado}" required><br>

    <br>
    <button type="submit">Generar Pre-registro</button>
</form>

<div th:if="${mensajeExito}" style="color: green; font-weight: bold;"><span th:text="${mensajeExito}"></span></div>
<div th:if="${mensajeError}" style="color: red; font-weight: bold;"><span th:text="${mensajeError}"></span></div>

<script>
    function actualizarLimiteDocumento(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);
        select.addEventListener('change', function() {
            const tipo = select.value;
            if (tipo === 'DNI') { input.maxLength = 8; input.placeholder = "8 dígitos"; }
            else if (tipo === 'RUC') { input.maxLength = 11; input.placeholder = "11 dígitos"; }
            else if (tipo === 'PASAPORTE') { input.maxLength = 9; input.placeholder = "9 caracteres"; }
            input.value = '';
        });
        select.dispatchEvent(new Event('change'));
    }
    document.addEventListener("DOMContentLoaded", function() {
        actualizarLimiteDocumento('remitenteTipoDocumento', 'remitenteDni');
        actualizarLimiteDocumento('destinatarioTipoDocumento', 'destinatarioDni');
    });
</script>
</body>
</html>
