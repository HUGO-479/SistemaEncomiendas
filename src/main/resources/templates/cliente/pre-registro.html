<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-registro - Atyra Express</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body class="cliente-body">

<div class="cliente-container">

    <!-- Logo -->
    <div class="cliente-header">
        <div class="cliente-logo">
            <div class="cliente-logo-icon">📦</div>
            <span>Atyra <span style="color: var(--accent-dk);">Express</span></span>
        </div>
    </div>

    <h1>Pre-registro de Encomienda</h1>
    <p class="cliente-subtitle">Complete los datos de su envío.</p>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="cliente-alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="cliente-alert alert-error" th:text="${mensajeError}"></div>

    <form th:action="@{/cliente/pre-registro/guardar}" th:object="${preRegistro}" method="post">

        <!-- SECCIÓN: REMITENTE (DATOS BLOQUEADOS) -->
        <h3 class="cliente-form-section-title">Datos del Remitente (Tú)</h3>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Tipo Documento</label>
                <input type="text" th:value="${remitenteLogueado.tipoDocumento}" readonly class="input-readonly">
                <!-- Campos ocultos para enviar al backend -->
                <input type="hidden" th:field="*{remitenteTipoDocumento}" th:value="${remitenteLogueado.tipoDocumento}">
            </div>
            <div class="cliente-form-field">
                <label>N° Documento</label>
                <input type="text" th:value="${remitenteLogueado.numeroDocumento}" readonly class="input-readonly">
                <input type="hidden" th:field="*{remitenteDni}" th:value="${remitenteLogueado.numeroDocumento}">
            </div>
        </div>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Nombres y Apellidos</label>
                <input type="text" th:value="${remitenteLogueado.nombres + ' ' + remitenteLogueado.apellidos}" readonly class="input-readonly">
                <input type="hidden" th:field="*{remitenteNombres}" th:value="${remitenteLogueado.nombres}">
                <input type="hidden" th:field="*{remitenteApellidos}" th:value="${remitenteLogueado.apellidos}">
            </div>
        </div>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Celular</label>
                <input type="text" th:value="${remitenteLogueado.telefono}" readonly class="input-readonly">
                <input type="hidden" th:field="*{remitenteCelular}" th:value="${remitenteLogueado.telefono}">
            </div>
        </div>

        <!-- SECCIÓN: DESTINATARIO -->
        <h3 class="cliente-form-section-title">Datos del Destinatario</h3>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Tipo Documento</label>
                <select th:field="*{destinatarioTipoDocumento}" id="destinatarioTipoDocumento" onchange="actualizarCampos('destinatario')">
                    <option value="DNI">DNI</option>
                    <option value="RUC">RUC</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>
            </div>
            <div class="cliente-form-field">
                <label>N° Documento</label>
                <input type="text" th:field="*{destinatarioDni}" id="destinatarioDni" required>
            </div>
        </div>

        <div class="cliente-form-group" id="destinatario_campos_persona">
            <div class="cliente-form-field"><label>Nombres</label><input type="text" th:field="*{destinatarioNombres}"></div>
            <div class="cliente-form-field"><label>Apellidos</label><input type="text" th:field="*{destinatarioApellidos}"></div>
        </div>

        <div class="cliente-form-group" id="destinatario_campos_empresa" style="display:none;">
            <div class="cliente-form-field"><label>Razón Social</label><input type="text" th:field="*{destinatarioRazonSocial}"></div>
        </div>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Celular</label>
                <!-- ✅ Validación de 9 dígitos exactos -->
                <input type="text" th:field="*{destinatarioCelular}" required maxlength="9" pattern="[0-9]{9}" title="Debe ingresar 9 dígitos numéricos">
            </div>
        </div>

        <!-- SECCIÓN: ENVÍO -->
        <h3 class="cliente-form-section-title">Datos del Envío</h3>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Agencia Origen</label>
                <select th:field="*{agenciaOrigenId}" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
                </select>
            </div>
            <div class="cliente-form-field">
                <label>Agencia Destino</label>
                <select th:field="*{agenciaDestinoId}" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="a : ${agencias}" th:value="${a.id}" th:text="${a.nombre}"></option>
                </select>
            </div>
        </div>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Tipo de Paquete</label>
                <select th:field="*{tipoPaqueteId}" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="tp : ${tiposPaquete}" th:value="${tp.id}" th:text="${tp.nombre}"></option>
                </select>
            </div>
            <div class="cliente-form-field">
                <label>Descripción</label>
                <input type="text" th:field="*{descripcionBulto}" required>
            </div>
        </div>

        <div class="cliente-form-group">
            <div class="cliente-form-field">
                <label>Peso aproximado (kg)</label>
                <input type="number" step="0.1" th:field="*{pesoEstimado}" required>
            </div>
        </div>

        <!-- Botones -->
        <div class="cliente-footer-actions">
            <a th:href="@{/cliente/dashboard}" class="btn-back">← Volver al Panel</a>
            <button type="submit" class="btn-submit">Generar Pre-registro</button>
        </div>

    </form>

</div>

<!-- Estilo rápido para los campos de solo lectura -->
<style>
    .input-readonly {
        background-color: #f0f0f0;
        color: #666;
        cursor: not-allowed;
    }
</style>

<script>
    function actualizarCampos(prefijo) {
        const select = document.getElementById(prefijo + 'TipoDocumento');
        const inputDoc = document.getElementById(prefijo + 'Dni');
        const divPersona = document.getElementById(prefijo + '_campos_persona');
        const divEmpresa = document.getElementById(prefijo + '_campos_empresa');
        if (!select || !inputDoc) return;
        const tipo = select.value;
        if (tipo === 'DNI') { inputDoc.maxLength = 8; inputDoc.placeholder = "8 dígitos"; divPersona.style.display = 'flex'; divEmpresa.style.display = 'none'; }
        else if (tipo === 'RUC') { inputDoc.maxLength = 11; inputDoc.placeholder = "11 dígitos"; divPersona.style.display = 'none'; divEmpresa.style.display = 'flex'; }
        else if (tipo === 'PASAPORTE') { inputDoc.maxLength = 9; inputDoc.placeholder = "9 caracteres"; divPersona.style.display = 'flex'; divEmpresa.style.display = 'none'; }
        inputDoc.value = '';
    }
    document.addEventListener("DOMContentLoaded", function() { actualizarCampos('destinatario'); });
</script>
</body>
</html>
